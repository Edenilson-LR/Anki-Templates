
<!-- Estructura HTML para el cronómetro -->
<div class="timer-icon" id="timer-toggle">
<div class="timer-icon" id="timer-toggle">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <circle cx="12" cy="12" r="10" fill="var(--accent)" />
    <path d="M12 6v6l4 2" stroke="var(--background-primary)" stroke-width="2" fill="none" />
  </svg>
</div>

<div class="timer-container" id="timer-container">
  <div id="timer">00:00</div>
  <div class="timer-controls">
    <button id="start-timer-btn" onclick="startTimerClick('timer')">Iniciar</button>
    <button id="reset-timer-btn" onclick="resetTimer('timer')">Reiniciar</button>
  </div>
</div>

<script>
// Variables globales para el cronómetro
var timerInterval = null;
var timerSeconds = 0;
var isRunning = false;
var isTimerVisible = false;

// Función para mostrar/ocultar el cronómetro
document.getElementById('timer-toggle').addEventListener('click', function() {
  var timerContainer = document.getElementById('timer-container');
  isTimerVisible = !isTimerVisible;
  
  if (isTimerVisible) {
    timerContainer.classList.add('visible');
  } else {
    timerContainer.classList.remove('visible');
  }
});

// Función para iniciar el cronómetro automáticamente
window.onload = function() {
  // Iniciar el cronómetro automáticamente después de 1 segundo
  setTimeout(function() {
    startTimer('timer');
  }, 1000);
};

// Función para iniciar el cronómetro automáticamente
function startTimer(elementId) {
  // Si ya está corriendo, no hacer nada
  if (isRunning) return;
  
  isRunning = true;
  const timerElement = document.getElementById(elementId);
  if (!timerElement) return;
  
  // Asegurarse de que solo haya un intervalo activo
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  
  timerInterval = setInterval(function() {
    timerSeconds++;
    const minutes = Math.floor(timerSeconds / 60);
    const remainingSeconds = timerSeconds % 60;
    timerElement.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
  }, 1000); // Exactamente 1000ms = 1 segundo
  
  // Cambiar el texto del botón
  document.getElementById('start-timer-btn').textContent = 'Pausar';
  document.getElementById('start-timer-btn').onclick = function() { pauseTimer(elementId); };
}

// Función para iniciar el cronómetro al hacer clic
function startTimerClick(elementId) {
  startTimer(elementId);
}

// Función para pausar el cronómetro
function pauseTimer(elementId) {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
    
    // Cambiar el texto del botón
    document.getElementById('start-timer-btn').textContent = 'Continuar';
    document.getElementById('start-timer-btn').onclick = function() { startTimerClick(elementId); };
  }
}

// Función para reiniciar el cronómetro
function resetTimer(elementId) {
  // Detener el cronómetro si está corriendo
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    isRunning = false;
  }
  
  // Reiniciar el contador
  timerSeconds = 0;
  const timerElement = document.getElementById(elementId);
  if (timerElement) {
    timerElement.textContent = '00:00';
  }
  
  // Restablecer el botón
  document.getElementById('start-timer-btn').textContent = 'Iniciar';
  document.getElementById('start-timer-btn').onclick = function() { startTimerClick(elementId); };
}
</script>
