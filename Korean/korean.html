<div class="flashcard">
    <div class="front">
        <span id="palabra">{{Korean Word}}</span>
        <hr>
        <div class="audio"> {{Korean Audio}} </div>
    </div>
    <hr>
    <div class="back">
        <div class="traduccion-p">{{Korean Translation}}</div>
        <hr>

        <div class="Imagen"> {{Korean Image}} </div>

        <hr>
        <div class="oracion" id="oracion">
            {{Korean Sentence}}
        </div>
        {{Korean Sentence Audio}}
    </div>

    <script>
        // Función para inicializar el resaltado
        window.onload = function () {
            setTimeout(doHighlight, 1500);
        };

        // Función de resaltado adaptada para coreano
        function doHighlight() {
            try {
                var palabra = document.getElementById('palabra');
                var oracion = document.getElementById('oracion');
                var traduccion = document.querySelector('.traduccion-p');

                if (!palabra || !oracion) return;

                var wordToFind = palabra.textContent.trim();

                // Highlight translation
                if (traduccion && traduccion.textContent.trim()) {
                    var transText = traduccion.textContent.trim();
                    traduccion.innerHTML = '<span class="highlight-traduccion">' + transText + '</span>';
                }

                // Get sentence text
                var sentence = oracion.textContent || oracion.innerText || '';
                if (!sentence.trim()) return;

                // Para coreano, buscamos la palabra exacta y sus variaciones comunes
                var words = [wordToFind];

                // Agregar variaciones comunes del coreano
                // Ejemplo: si la palabra es 먹다 (comer), agregar 먹어, 먹었어, 먹고, etc.
                if (wordToFind.endsWith('다')) {
                    var stem = wordToFind.slice(0, -1); // Quitar 다
                    words.push(stem + '어');
                    words.push(stem + '었어');
                    words.push(stem + '고');
                    words.push(stem + '어요');
                    words.push(stem + '었어요');
                    words.push(stem + '습니다');
                    words.push(stem + '었습니다');
                }

                // Agregar partículas comunes
                words.push(wordToFind + '은');
                words.push(wordToFind + '는');
                words.push(wordToFind + '이');
                words.push(wordToFind + '가');
                words.push(wordToFind + '을');
                words.push(wordToFind + '를');
                words.push(wordToFind + '에');
                words.push(wordToFind + '에서');
                words.push(wordToFind + '와');
                words.push(wordToFind + '과');

                // Highlight each word
                var result = sentence;
                for (var i = 0; i < words.length; i++) {
                    var word = words[i];
                    if (word && word.length > 0) {
                        // Para coreano, no usamos word boundaries (\b) ya que no funcionan bien
                        var regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
                        result = result.replace(regex, '<span class="highlight-word">' + word + '</span>');
                    }
                }

                oracion.innerHTML = result;
            } catch (e) {
                console.log('Error:', e);
            }
        }

        // Try multiple times to ensure it works
        setTimeout(doHighlight, 10);
        setTimeout(doHighlight, 100);
        setTimeout(doHighlight, 300);
        setTimeout(doHighlight, 1000);
        setTimeout(doHighlight, 2000);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', doHighlight);
        } else {
            doHighlight();
        }
    </script>
</div>
